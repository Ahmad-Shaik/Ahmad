<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Star Rating</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background-color: black;
        }
    
        .card {
          background-color: rgb(247, 162, 162);
          width: 300px;
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0px 0px 20px rgb(240, 142, 142);
          text-align: center;
        }
    
        .card h2 {
          font-size: 24px;
          margin-bottom: 20px;
        }
    
        .stars {
          display: flex;
          justify-content: center;
          margin-bottom: 20px;
        }
    
        .star {
          font-size: 30px;
          color: #080000;
          cursor: pointer;
          transition: color 0.3s ease;
        }
    
        .star.active {
          color: #ffcc00;
        }
    
        .rating {
          font-size: 18px;
        }
    
      </style>
    </head>
    <body>
    
      <div class="card">
        <h2>JavaScript</h2>
        <div class="stars">
          <span class="star" value="1">&#9733;</span>
          <span class="star" value="2">&#9733;</span>
          <span class="star" value="3">&#9733;</span>
          <span class="star" value="4">&#9733;</span>
          <span class="star" value="5">&#9733;</span>
        </div>
        <div class="rating">
          The rating is: <span id="rating">0</span>/5
        </div>
      </div>
    
      <script>
        // Get all the star elements and the rating display
        const stars = document.querySelectorAll('.star');
        const ratingDisplay = document.getElementById('rating');
    
        // Function to handle star click
        function handleStarClick(event) {
          const clickedIndex = parseInt(event.target.getAttribute('value'));
          
          // Set the rating and update the stars
          stars.forEach((star, index) => {
            if (index < clickedIndex) {
              star.classList.add('active');
            } else {
              star.classList.remove('active');
            }
          });
    
          // Update the displayed rating
          ratingDisplay.textContent = clickedIndex;
        }
    
        // Add click event listener to each star
        stars.forEach(star => {
          star.addEventListener('click', handleStarClick);
        });
      </script>
    
</body>
</html>
