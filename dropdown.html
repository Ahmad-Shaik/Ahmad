<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

nav {
    background-color: #d42a2a; /* Red background similar to image */
    padding: 10px;
}
.dropbtn {
    text-decoration: none;
    color: white;
    padding: 10px 20px;
    display: block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: black; /* Matching black background */
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
    min-width: 220px;
}

.dropdown-content li {
    list-style: none;
}

.dropdown-content a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    text-decoration: none;
    color: white; /* White text to match image */
    font-weight: bold; /* Bold text */
    border-bottom: 1px solid rgba(255, 255, 255, 0.2); /* Light white separator */
}

.dropdown-content a:hover {
    background-color: #0a0909; /* Dark grey hover effect */
}

.dropdown:hover .dropdown-content {
    display: block;
}

.sub-dropdown {
    position: relative;
}

.sub-dropdown-content {
    display: none;
    position: absolute;
    left: 100%;
    top: 0;
    background-color: black; /* Matching sub-menu background */
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
    min-width: 220px;
}

.sub-dropdown:hover .sub-dropdown-content {
    display: block;
}
    </style>
</head>

<body>

    <nav>
        <ul class="menu">
            <li class="dropdown">
                <a href="#" class="dropbtn">Courses </a>
                <ul class="dropdown-content">
                    <li class="sub-dropdown">
                        <a href="#">Data Science </a>
                        <ul class="sub-dropdown-content">
                            <li><a href="#">Data Science Course</a></li>
                            <li><a href="#">Online Data Science</a></li>
                            <li><a href="#">Advanced Generative AI</a></li>
                            <li><a href="#">Data Science Course for IT Leaders</a></li>
                            <li><a href="#">Pre-Placement Program</a></li>
                        </ul>
                    </li>
                    <li><a href="#">Full Stack Development</a></li>
                    <li><a href="#">Digital Marketing</a></li>
                    <li><a href="#">Amazon Web Services (AWS)</a></li>
                </ul>
            </li>
        </ul>
    </nav>

</body>

</html>
