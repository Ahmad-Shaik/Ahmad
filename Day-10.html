<!DOCTYPE html>

    <title>Day-10</title>

  <body>
    <form action="">
      <fieldset>
        <legend>Registration Page</legend>
        <table align="center">
          <tr>
            <td>User name</td>
            <td>:</td>
            <td><input type="text" name="" id="" required /></td>
          </tr>
          <tr>
            <td>Email</td>
            <td>:</td>
            <td><input type="email" name="" id="" required /></td>
          </tr>
          <tr>
            <td>Password</td>
            <td>:</td>
            <td><input type="password" name="" id="" required /></td>
          </tr>
          <tr>
            <td>Confirm Password</td>
            <td>:</td>
            <td><input type="password" name="" id="" required /></td>
          </tr>
          <tr>
            <td>Date Of Birth</td>
            <td>:</td>
            <td><input type="date" name="" id="" required /></td>
          </tr>
          <tr>
            <td>Mobile No</td>
            <td>:</td>
            <td><input type="number" name="" id="" required /></td>
          </tr>
          <tr>
            <td>Gender</td>
            <td>:</td>
            <td>
              <input type="radio" name="s" id="" required />Male <br /><input
                type="radio"
                name="s"
                id=""
                required
              />Female <br />
              <input type="radio" name="s" id="" required />Other
            </td>
          </tr>
          <tr>
            <td>Upload single file</td>
            <td>:</td>
            <td><input type="file" name="" id="" required/></td>
          </tr>
          <tr>
            <td>Upload multiple file</td>
            <td>:</td>
            <td><input type="file" name="" id="" multiple required/></td>
          </tr>
          <tr>
            <td>Addhar No</td>
            <td>:</td>
            <td><input type="number" name="" id="" required/></td>
          </tr>
          <tr>
            <td>District</td>
            <td>:</td>
            <td>
              <select name="" id="" required>
                <option value="">---select---</option>
                <optgroup label="Srikakulam">
                  <option value="">1. Srikakulam</option>
                  <option value="">2. Tekkali</option>
                  <option value="">3. Palasa</option>
                </optgroup>
                <optgroup label="Vizianagaram">
                  <option value="">1. Bobbili</option>
                  <option value="">2. Vizianagaram</option>
                  <option value="">3. Cheepurupalle</option>
                </optgroup>
                <optgroup label="Parvathipuram Manyam">
                  <option value="">1. Parvathipuram</option>
                  <option value="">2. Palakonda</option>
                </optgroup>
                <optgroup label="Alluri Sitharama Raju">
                  <option value="">1. Rampachodavaram</option>
                  <option value="">2. Visakhapatnam</option>
                </optgroup>
                <optgroup label="Visakhapatnam">
                  <option value="">1. Bheemunipatnam</option>
                  <option value="">2. Paderu</option>
                </optgroup>
                <optgroup label="Anakapalli">
                  <option value="">1. Anakapalli</option>
                  <option value="">2. Narasipatnam</option>
                </optgroup>
                <optgroup label="Kakinada">
                  <option value="">1. Kakinada</option>
                  <option value="">2. Peddapuram</option>
                </optgroup>
              </select>
            </td>
          </tr>
          <tr>
            <td>Address</td>
            <td>:</td>
            <td><textarea name="" id="" required></textarea></td>
          </tr>
          <tr>
            <td colspan="3" align="center">
              <input type="submit" value="submit" />&nbsp; <input type="reset" value="reset">
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
