<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>registration page</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend class="legend">Registration page</legend>
            <div class="login-div">
                <label>First name :</label>
                <input type="text" id="fname" name="fname" placeholder="Enter firstname"><br><br>
                <label>Last name :</label>
                <input type="text" id="lname" name="lname" placeholder="Enter lastname"><br><br>
                <label>Phone Number :</label>
                <input type="text" id="phno" name="phno" placeholder="+91 921XXXXXX21"><br><br>
                <label>E-mail :</label>
                <input type="mail" id="mail" name="mail" placeholder="johndoe260@gmail.com"><br><br>
                <label>Password :</label>
                <input type="password" id="password" name="password" placeholder="Enter Password"><br><br>
                <input type="submit" value="Submit" class="login-div">
            </div>
        </fieldset>
    </form>
</body>
</html>
