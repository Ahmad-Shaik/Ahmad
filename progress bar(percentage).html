<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Progress Steps</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- WITH PERCENTAGE -->


<div class="container mt-5">
    <!-- Progress Bar -->
    <div class="progress mb-4">
        <div id="progressBar" class="progress-bar" role="progressbar" style="width: 35%;" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100">35%</div>
    </div>

    <!-- Carousel to switch divs -->
    <div id="stepCarousel" class="carousel slide" data-bs-ride="false" data-bs-interval="false">
        <div class="carousel-inner">
            <!-- Step 1 -->
            <div class="carousel-item active text-center">
                <h3>Step 1</h3>
                <p>This is the first step.</p>
            </div>
            <!-- Step 2 -->
            <div class="carousel-item text-center">
                <h3>Step 2</h3>
                <p>This is the second step.</p>
            </div>
            <!-- Step 3 -->
            <div class="carousel-item text-center">
                <h3>Step 3</h3>
                <p>This is the third step.</p>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="text-center mt-3">
            <button class="btn btn-secondary" type="button" data-bs-target="#stepCarousel" data-bs-slide="prev">
                Back
            </button>
            <button class="btn btn-primary ms-2" type="button" data-bs-target="#stepCarousel" data-bs-slide="next">
                Next
            </button>
        </div>
    </div>
</div>
 

<!-- Bootstrap JS (for carousel functionality) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('stepCarousel').addEventListener('slid.bs.carousel', function (event) {
        let progressBar = document.getElementById('progressBar');
        let progressValues = [35, 70, 100];
        let newProgress = progressValues[event.to];
        progressBar.style.width = newProgress + "%";
        progressBar.innerText = newProgress + "%";
    });

    // Custom Logic to Prevent Looping
    let carousel = new bootstrap.Carousel(document.getElementById('stepCarousel'), {
        wrap: false // Disable wrapping (no looping)
    });

    // Prevent going back from the first item and forward from the last item
    document.querySelector('[data-bs-slide="prev"]').addEventListener('click', function() {
        if (carousel._activeElement === carousel._items[0]) {
            return; // Don't allow moving back from the first step
        }
    });

    document.querySelector('[data-bs-slide="next"]').addEventListener('click', function() {
        if (carousel._activeElement === carousel._items[carousel._items.length - 1]) {
            return; // Don't allow moving forward from the last step
        }
    });
</script>


</body>
</html>
