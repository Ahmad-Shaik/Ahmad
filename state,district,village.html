<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select State, District, and Village/City with Bootstrap</title>
    <!-- Link to Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Function to update districts based on the selected state
        function updateDistricts() {
            const state = document.getElementById("states").value;
            const districtSelect = document.getElementById("districts");
            const villageSelect = document.getElementById("village");

            // Clear previous district and village options
            districtSelect.innerHTML = '<option value="">--Select District--</option>';
            villageSelect.innerHTML = '<option value="">--Select Village/City--</option>';

            // Define districts for each state
            const stateDistricts = {
                "Andhra Pradesh": ["Anantapur", "Chittoor", "East Godavari"],
                "Arunachal Pradesh": ["Tawang", "West Kameng", "East Kameng"],
                "Assam": ["Baksa", "Barpeta", "Bongaigaon"],
                "Bihar": ["Araria", "Aurangabad", "Banka"]
                // Add more states and districts...
            };

            // Populate districts if the state has defined districts
            if (stateDistricts[state]) {
                stateDistricts[state].forEach(function(district) {
                    const option = document.createElement("option");
                    option.value = district;
                    option.text = district;
                    districtSelect.appendChild(option);
                });
            }
        }

        // Function to update villages/cities based on the selected district
        function updateVillages() {
            const district = document.getElementById("districts").value;
            const villageSelect = document.getElementById("village");

            // Define cities/villages for each district
            const districtCities = {
                "Anantapur": ["Anantapur City", "Penukonda", "Dharmavaram"],
                "Chittoor": ["Chittoor City", "Tirupati", "Madanapalle"],
                "East Godavari": ["Kakinada", "Rajahmundry", "Eluru"],
                "Tawang": ["Tawang City", "Jang", "Mago"],
                "West Kameng": ["Bomdila", "Dirang", "Rupa"],
                "East Kameng": ["Seppa", "Sangdupota", "Ziro"],
                "Baksa": ["Barpeta", "Bongabari", "Kalgachia"],
                "Barpeta": ["Barpeta City", "Mandia", "Kochkola"],
                "Bongaigaon": ["Bongaigaon City", "Kochugaon", "Goreswar"],
                "Araria": ["Araria Town", "Jogbani", "Falaswari"],
                "Aurangabad": ["Aurangabad City", "Rafiganj", "Barun"],
                "Banka": ["Banka City", "Amarpur", "Katoria"]
                // Add more cities/villages for more districts...
            };

            // Clear previous village options
            villageSelect.innerHTML = '<option value="">--Select Village/City--</option>';

            // Populate villages/cities if the district has defined cities/villages
            if (districtCities[district]) {
                districtCities[district].forEach(function(village) {
                    const option = document.createElement("option");
                    option.value = village;
                    option.text = village;
                    villageSelect.appendChild(option);
                });
            }
        }
    </script>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <!-- State Select Box -->
            <div class="col-md-4">
                <label for="states">Select a state:</label>
                <select id="states" name="states" class="form-select" onchange="updateDistricts()">
                    <option value="">--Select State--</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Assam">Assam</option>
                    <option value="Bihar">Bihar</option>
                    <!-- Add more states here -->
                </select>
            </div>

            <!-- District Select Box -->
            <div class="col-md-4">
                <label for="districts">Select a district:</label>
                <select id="districts" name="districts" class="form-select" onchange="updateVillages()">
                    <option value="">--Select District--</option>
                    <!-- Districts will be populated here based on the selected state -->
                </select>
            </div>

            <!-- Village/City Select Box -->
            <div class="col-md-4">
                <label for="village">Select a village/city:</label>
                <select id="village" name="village" class="form-select">
                    <option value="">--Select Village/City--</option>
                    <!-- Villages/cities will be populated here based on the selected district -->
                </select>
            </div>
        </div>
    </div>

    <!-- Link to Bootstrap JS (Optional for dynamic interactions like modals, tooltips) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
